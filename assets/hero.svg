<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc">
<title id="title">D-SIDE: Distributional Selective Integration for Dynamics Estimation</title>
<desc id="desc">Research software for selective information sharing across systems with heterogeneous governing dynamics. Decorative trajectories are schematic.</desc>
