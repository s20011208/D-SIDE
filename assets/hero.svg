<text x="36" y="102" fill="#FFFFFF" font-size="58" font-weight="700" font-family="Arial, Helvetica, sans-serif" letter-spacing="1">D-SIDE</text>
<text x="39" y="148" fill="#F3F8FB" font-size="23" font-weight="500" font-family="Arial, Helvetica, sans-serif" >Distributional Selective Integration</text>
<text x="39" y="180" fill="#F3F8FB" font-size="23" font-weight="500" font-family="Arial, Helvetica, sans-serif" >for Dynamics Estimation</text>
<text x="39" y="223" fill="#AFCAD6" font-size="15" font-weight="400" font-family="Arial, Helvetica, sans-serif" >Scalar evidence. Selective borrowing. Nonparametric dynamics.</text>
