name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproducibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11"]
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MPLBACKEND: Agg
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Install the locked environment and package
        run: |
          python -m pip install --upgrade "pip==24.3.1" "setuptools==75.3.2" "wheel==0.45.1"
          python -m pip install -r requirements.lock.txt
          python -m pip install -e . --no-deps --no-build-isolation
      - name: Run numerical and release regression tests
        run: python -m pytest -q --junitxml=runs/pytest.xml
      - name: Expose test failures as public check annotations
        if: always()
        run: python scripts/report_test_failures.py --report runs/pytest.xml
      - name: Audit published result tables
        run: dside audit-results
      - name: Replay the fixed example
        run: dside demo --output runs/ci-demo
      - name: Compare the replay with the frozen predictions
        run: python scripts/verify_replay.py --run runs/ci-demo
      - name: Check documentation and figure links
        run: python scripts/check_release.py
